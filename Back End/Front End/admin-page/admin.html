<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | M.ABUELMAGD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='45' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>MA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="p-6 overflow-x-hidden min-h-screen flex flex-col items-center">

    <div id="login-screen" class="w-full max-w-md mt-20">
        <div class="glass-panel text-center">
            <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-500">
                <i data-lucide="lock" class="w-10 h-10"></i>
            </div>
            <h2 class="text-2xl font-black mb-6">منطقة محظورة 🛑</h2>
            <form id="loginForm">
                <input type="password" id="adminPassword" class="admin-input text-center text-xl tracking-widest" placeholder="كلمة المرور" required>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-blue-500 transition-colors">تسجيل الدخول</button>
            </form>
            <p id="loginError" class="text-red-500 mt-4 font-bold hidden">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="dashboard-screen" class="max-w-7xl mx-auto w-full hidden">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-blue-500">لوحة التحكم  ⚙️</h1>
            <div class="flex gap-4">
                <a href="../main-page/index.html" class="bg-blue-600 px-6 py-2 rounded-xl font-bold hover:bg-blue-500 transition-colors shadow-lg shadow-blue-500/30">الموقع</a>
                <button onclick="logout()" class="bg-red-600/20 text-red-500 px-4 py-2 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-colors">خروج</button>
            </div>
        </div>

        <div class="mb-10">
            <div class="glass-panel flex items-center justify-between border-blue-500/30 w-full md:w-1/3">
                <div>
                    <h3 class="text-slate-400 font-bold mb-1">إجمالي الزيارات</h3>
                    <p id="total-visits" class="text-4xl font-black text-blue-400">0</p>
                </div>
                <div class="w-14 h-14 bg-blue-500/20 rounded-2xl flex items-center justify-center text-blue-500 shadow-lg shadow-blue-500/20">
                    <i data-lucide="eye" class="w-7 h-7"></i>
                </div>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-10">
            <div>
                <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2">المشاريع</h2>
                <div class="glass-panel mb-6">
                    <h3 class="text-lg font-bold mb-4 text-emerald-400">إضافة مشروع جديد +</h3>
                    <form id="addProjectForm">
                        <input type="text" id="p-title" class="admin-input" placeholder="اسم المشروع" required>
                        <input type="text" id="p-descAr" class="admin-input" placeholder="الوصف بالعربي" required>
                        <input type="text" id="p-descEn" class="admin-input" placeholder="الوصف بالإنجليزي" required>
                        <input type="url" id="p-link" class="admin-input" placeholder="رابط المشروع" required>
                        <input type="text" id="p-cat" class="admin-input" placeholder="القسم (مثال: Front-End)" required>
                        <button type="submit" class="w-full bg-emerald-600 py-3 rounded-lg font-bold hover:bg-emerald-500 mt-2">إضافة المشروع</button>
                    </form>
                </div>
                <div id="admin-projects" class="space-y-4"></div>
            </div>

            <div>
                <h2 class="text-2xl font-bold mb-4 border-b border-slate-700 pb-2">التقييمات</h2>
                <div id="admin-reviews" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
