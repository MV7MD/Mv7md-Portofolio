<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشاريع | Muhammad Abuelmagd</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='45' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>MA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="projects.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 
                primary: '#3b82f6',
                accent: '#00d2ff'
            } } }
        }

        // 🌟 استعادة الثيم واللغة فوراً قبل عرض الصفحة لمنع الوميض الأبيض 🌟
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        if (localStorage.getItem('lang') === 'en') {
            document.documentElement.dir = 'ltr';
        } else {
            document.documentElement.dir = 'rtl';
        }
    </script>
</head>
<body class="bg-[#e2e8f0] dark:bg-[#020617] text-slate-900 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-500/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px]"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 bg-white/40 dark:bg-slate-950/40 backdrop-blur-2xl border-b border-white/20 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between" style="direction: ltr !important;">
            <div class="font-black text-2xl tracking-tighter bg-gradient-to-r from-blue-600 to-cyan-400 bg-clip-text text-transparent">M.ABUELMAGD</div>
            
            <div class="flex items-center gap-4 md:gap-6">
                <a href="../main-page/index.html" title="الرئيسية / Home" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all flex items-center justify-center group">
                    <i data-lucide="home" class="w-5 h-5 text-slate-700 dark:text-slate-300 group-hover:text-blue-600 transition-colors"></i>
                </a>

                <button id="theme-toggle" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all">
                    <i data-lucide="sun" class="hidden dark:block w-5 h-5 text-yellow-400"></i>
                    <i data-lucide="moon" class="block dark:hidden w-5 h-5 text-blue-600"></i>
                </button>
                
                <button id="lang-toggle" class="px-4 py-1.5 rounded-xl border-2 border-blue-500/20 font-bold text-sm hover:bg-blue-500 hover:text-white transition-all">EN</button>
            </div>
        </div>
    </nav>

    <main class="min-h-screen pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <h1 id="projects-head" class="text-4xl md:text-6xl font-black mb-16 text-center tracking-tight reveal fade-up">معرض <span class="text-blue-500">المشاريع</span></h1>
            
            <div id="projects-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
                </div>
        </div>
    </main>

    <script src="projects.js" defer></script>
</body>
</html>
