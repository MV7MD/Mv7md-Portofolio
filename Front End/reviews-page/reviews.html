<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال تقييم | Muhammad Abuelmagd</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='45' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>MA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="reviews.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#3b82f6', accent: '#00d2ff' } } }
        }
        
        // 🌟 استعادة الثيم واللغة فوراً لمنع الوميض 🌟
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('lang') === 'en') {
            document.documentElement.dir = 'ltr';
        }
    </script>
</head>
<body class="bg-[#e2e8f0] dark:bg-[#020617] text-slate-900 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-500/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px]"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 bg-white/40 dark:bg-slate-950/40 backdrop-blur-2xl border-b border-white/20 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between" style="direction: ltr !important;">
            <div class="font-black text-2xl tracking-tighter bg-gradient-to-r from-blue-600 to-cyan-400 bg-clip-text text-transparent">M.ABUELMAGD</div>
            
            <div class="flex items-center gap-4 md:gap-6">
                <a href="../main-page/index.html" title="الرئيسية / Home" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all flex items-center justify-center group">
                    <i data-lucide="home" class="w-5 h-5 text-slate-700 dark:text-slate-300 group-hover:text-blue-600 transition-colors"></i>
                </a>

                <button id="theme-toggle" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all">
                    <i data-lucide="sun" class="hidden dark:block w-5 h-5 text-yellow-400"></i>
                    <i data-lucide="moon" class="block dark:hidden w-5 h-5 text-blue-600"></i>
                </button>
                
                <button id="lang-toggle" class="px-4 py-1.5 rounded-xl border-2 border-blue-500/20 font-bold text-sm hover:bg-blue-500 hover:text-white transition-all">EN</button>
            </div>
        </div>
    </nav>

    <main class="min-h-screen pt-32 pb-20 px-6 flex items-center justify-center">
        <div class="max-w-2xl w-full"> 
            <h1 id="page-title" class="text-4xl md:text-5xl font-black mb-10 text-center tracking-tight text-slate-900 dark:text-white">شاركنا <span class="text-blue-500">رأيك</span></h1>

            <div class="glass-card p-8 md:p-12 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl"></div>
                <h2 id="form-head" class="text-2xl font-black mb-8 text-center relative z-10">اترك بصمتك هنا 👇</h2>
                
                <form id="reviewForm" class="space-y-6 relative z-10">
                    <input type="text" id="reviewerName" placeholder="الاسم" required class="glass-input">
                    <textarea id="reviewMessage" rows="5" placeholder="رأيك بكل صراحة..." required class="glass-input"></textarea>
                    
                    <div class="glass-input flex items-center justify-between">
                        <label id="rating-label" class="text-lg font-bold opacity-80">التقييم:</label>
                        <div class="interactive-stars flex flex-row-reverse gap-2" id="star-container">
                            <button type="button" class="star" data-value="5"><i data-lucide="star"></i></button>
                            <button type="button" class="star" data-value="4"><i data-lucide="star"></i></button>
                            <button type="button" class="star" data-value="3"><i data-lucide="star"></i></button>
                            <button type="button" class="star" data-value="2"><i data-lucide="star"></i></button>
                            <button type="button" class="star" data-value="1"><i data-lucide="star"></i></button>
                        </div>
                        <input type="hidden" id="ratingValue" value="0">
                    </div>

                    <button type="submit" id="submit-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl shadow-xl shadow-blue-500/30 transition-all hover:-translate-y-1 active:scale-95 text-lg">إرسال التقييم 🚀</button>
                </form>
            </div>
        </div>
    </main>
<div id="success-popup" class="fixed inset-0 z-[100] flex items-center justify-center px-6 hidden opacity-0 transition-all duration-500">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md"></div>
        <div class="relative bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl border border-blue-500/30 max-w-sm w-full text-center scale-90 transition-transform duration-500" id="popup-content">
            <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-10 h-10 text-blue-500"></i>
            </div>
            <h3 class="text-2xl font-black mb-2 dark:text-white" id="popup-head">تم الإرسال!</h3>
            <p class="text-slate-500 dark:text-slate-400 mb-8" id="popup-msg">تم إرسال تقييمك بنجاح، شكراً لك ❤️</p>
            <button onclick="closePopup()" id="popup-btn" class="w-full py-3 bg-slate-100 dark:bg-slate-800 font-bold rounded-xl hover:bg-blue-500 hover:text-white transition-all">إغلاق</button>
        </div>
    </div>
    <script src="reviews.js" defer></script>
</body>
</html>
