<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | M.ABUELMAGD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='45' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>MA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="p-6 overflow-x-hidden min-h-screen flex flex-col items-center">

    <div id="login-screen" class="w-full max-w-md mt-20">
        <div class="glass-panel text-center">
            <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-500 shadow-[0_0_30px_rgba(59,130,246,0.2)]">
                <i data-lucide="lock" class="w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-black mb-2 text-white">منطقة الإدارة</h2>
            <p class="text-slate-400 mb-8 font-medium">يرجى إدخال كلمة المرور للمتابعة</p>
            <form id="loginForm">
                <input type="password" id="adminPassword" class="admin-input text-center text-2xl tracking-[0.3em] font-black" placeholder="••••••••" required>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 py-4 rounded-xl font-black text-lg hover:bg-blue-500 hover:-translate-y-1 transition-all shadow-lg shadow-blue-500/30 mt-2">تسجيل الدخول</button>
            </form>
            <p id="loginError" class="text-red-400 mt-4 font-bold hidden bg-red-500/10 py-2 rounded-lg">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="dashboard-screen" class="max-w-7xl mx-auto w-full hidden pb-10">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 glass-panel py-4 px-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="layout-dashboard"></i>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight">لوحة <span class="text-blue-500">التحكم</span></h1>
            </div>
            <div class="flex gap-4">
                <a href="../main-page/index.html" class="flex items-center gap-2 bg-slate-800 border border-slate-700 px-6 py-2.5 rounded-xl font-bold hover:bg-slate-700 transition-colors text-white">
                    <i data-lucide="globe" class="w-4 h-4"></i> زيارة الموقع
                </a>
                <button onclick="logout()" class="flex items-center gap-2 bg-red-500/10 text-red-500 border border-red-500/20 px-6 py-2.5 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i> خروج
                </button>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8 mb-10">
            <div class="glass-panel flex items-center justify-between border-l-4 border-l-blue-500">
                <div>
                    <h3 class="text-slate-400 font-bold mb-1 text-lg">إجمالي الزيارات</h3>
                    <p id="total-visits" class="text-5xl font-black text-white mt-2">0</p>
                </div>
                <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500">
                    <i data-lucide="users" class="w-8 h-8"></i>
                </div>
            </div>

            <div class="glass-panel border-l-4 border-l-purple-500 flex flex-col justify-center">
                <h3 class="text-slate-200 font-bold mb-3 flex items-center gap-2">
                    <i data-lucide="camera" class="w-5 h-5 text-purple-500"></i> تغيير الصورة الشخصية
                </h3>
                <form id="profilePicForm" class="flex gap-3">
                    <label for="profile-image-upload" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center cursor-pointer hover:bg-slate-700 transition-colors text-slate-300 font-semibold text-sm flex items-center justify-center gap-2">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> اختر صورة جديدة
                    </label>
                    <input type="file" id="profile-image-upload" class="hidden" accept="image/*">
                    <button type="submit" id="btn-update-profile" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-500 transition-colors shadow-lg shadow-purple-500/20">تحديث</button>
                </form>
            </div>
        </div>

        <div class="grid lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-7 space-y-8">
                
                <div class="glass-panel border-t-4 border-t-emerald-500">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-emerald-500/10 rounded-lg flex items-center justify-center text-emerald-500">
                            <i data-lucide="plus-circle"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white">إضافة مشروع جديد</h2>
                    </div>
                    
                    <form id="addProjectForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="p-title" class="admin-input m-0" placeholder="اسم المشروع (Title)" required>
                            <input type="text" id="p-cat" class="admin-input m-0" placeholder="القسم (مثال: Front-End)" required>
                        </div>
                        <input type="text" id="p-descAr" class="admin-input m-0" placeholder="الوصف بالعربية" required>
                        <input type="text" id="p-descEn" class="admin-input m-0" placeholder="الوصف بالإنجليزية" required>
                        <input type="url" id="p-link" class="admin-input m-0" placeholder="رابط المشروع (URL)" required>
                        
                        <div class="border-2 border-dashed border-slate-700 rounded-xl p-4 text-center hover:border-emerald-500 transition-colors cursor-pointer relative">
                            <input type="file" id="p-image" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*" required>
                            <div class="pointer-events-none">
                                <i data-lucide="image-plus" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
                                <span id="file-name-display" class="text-slate-300 font-bold">اضغط هنا لاختيار صورة للمشروع</span>
                                <p class="text-xs text-slate-500 mt-1">PNG, JPG, WEBP (يفضل مقاس عرضي)</p>
                            </div>
                        </div>

                        <button type="submit" id="btn-add-project" class="w-full bg-emerald-600 py-4 rounded-xl font-black text-white hover:bg-emerald-500 transition-all hover:-translate-y-1 shadow-lg shadow-emerald-500/30 mt-4 text-lg">
                            نشر المشروع 🚀
                        </button>
                    </form>
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-300">
                        <i data-lucide="layers" class="text-blue-500"></i> المشاريع الحالية
                    </h2>
                    <div id="admin-projects" class="space-y-4"></div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-8">
                <div>
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-300">
                        <i data-lucide="message-square-heart" class="text-amber-500"></i> التقييمات الواردة
                    </h2>
                    <div id="admin-reviews" class="space-y-4 max-h-[800px] overflow-y-auto pr-2 custom-scrollbar"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
