    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-family='sans-serif' font-size='45' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>MA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#3b82f6', accent: '#00d2ff' } } }
        }
        
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('lang') === 'en') {
            document.documentElement.dir = 'ltr';
        }
    </script>
</head>
<body class="bg-[#e2e8f0] dark:bg-[#020617] text-slate-900 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden relative">

        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px]"></div>

            <div class="font-black text-2xl tracking-tighter bg-gradient-to-r from-blue-600 to-cyan-400 bg-clip-text text-transparent z-50 relative">M.ABUELMAGD</div>
            
            <div class="hidden md:flex items-center gap-8 font-bold text-sm tracking-wide" style="direction: rtl;">
                <a href="../projects-page/projects.html" class="nav-projects hover:text-blue-500 transition-colors uppercase">المشاريع</a>
                <a href="../reviews-view-page/reviews-view.html" class="nav-reviews hover:text-blue-500 transition-colors uppercase">التقييمات</a>
                <a href="#contact" class="nav-contact hover:text-blue-500 transition-colors uppercase">تواصل معي</a>
            </div>

            <div class="flex items-center gap-4 z-50 relative">
                <button id="theme-toggle" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all">

                <button id="lang-toggle" class="px-4 py-1.5 rounded-xl border-2 border-blue-500/20 font-bold text-sm hover:bg-blue-500 hover:text-white transition-all">EN</button>
                <button id="mobile-menu-btn" class="md:hidden p-2.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 shadow-lg hover:shadow-blue-500/20 transition-all flex items-center justify-center">

                </button>
            </div>
        </div>

        <div id="mobile-menu" class="mobile-menu absolute top-24 right-6 bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl p-6 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col items-start gap-6 w-56 z-40 md:hidden" style="direction: rtl;">
            <a href="../projects-page/projects.html" class="nav-projects text-lg font-black hover:text-blue-500 transition-colors mobile-link w-full">المشاريع</a>
            <hr class="w-full border-slate-200 dark:border-slate-800">
            <a href="../reviews-view-page/reviews-view.html" class="nav-reviews text-lg font-black hover:text-blue-500 transition-colors mobile-link w-full">التقييمات</a>
            <hr class="w-full border-slate-200 dark:border-slate-800">
            <a href="#contact" class="nav-contact text-lg font-black hover:text-blue-500 transition-colors mobile-link w-full">تواصل معي</a>
        </div>

    <section class="min-h-screen flex items-center justify-center pt-24 px-6 relative z-10">

            <div class="flex-1 text-left reveal fade-up" id="hero-text-container">
                <h2 class="text-blue-500 font-bold tracking-[0.3em] mb-4 uppercase text-sm">Portfolio 2026</h2>
                <h1 id="hero-name" class="text-4xl md:text-6xl lg:text-7xl font-black mb-6 tracking-tight">
                    <span class="text-slate-900 dark:text-white">محمد</span> <span class="text-blue-500">أبو المجد</span>
                </h1>
                <p id="hero-title" class="text-lg md:text-xl text-slate-600 dark:text-slate-400 font-medium max-w-xl leading-relaxed">Full-Stack Developer</p>
            </div>
            
            <div class="flex flex-col items-center gap-8">
                <div class="relative group floating-img reveal zoom-in delay-200">
                    <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-400 rounded-full blur opacity-40 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
                    <img src="your-photo.jpg" alt="Muhammad" class="relative w-64 h-64 md:w-72 md:h-72 rounded-full object-cover border-[6px] border-white dark:border-slate-900 shadow-2xl">
                </div>
                
                <div class="flex gap-4 md:gap-6 flex-wrap justify-center">
                    <a href="https://github.com/MV7MD" target="_blank" class="social-circle reveal zoom-in delay-300"><i data-lucide="github" class="w-6 h-6"></i></a>

                    <a href="mailto:mv7mdvboelmaged@gmail.com" class="social-circle reveal zoom-in delay-500"><i data-lucide="mail" class="w-6 h-6"></i></a>
                    
                    <a href="https://wa.me/+201034318843" target="_blank" class="social-circle reveal zoom-in delay-600" title="WhatsApp">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.316c0-5.446 4.439-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>

    <section id="projects" class="max-w-7xl mx-auto px-6 py-20 relative z-10">
        <h2 id="projects-head" class="text-4xl font-black mb-16 text-center reveal fade-up">المشاريع</h2>
        <div id="projects-container" class="grid md:grid-cols-2 gap-10"></div>
        <div class="mt-16 text-center reveal fade-up delay-200">
            <a href="../projects-page/projects.html" id="btn-all-projects" class="inline-block px-10 py-4 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black rounded-2xl shadow-xl hover:-translate-y-1 hover:shadow-blue-500/20 transition-all border border-transparent dark:hover:bg-slate-100">رؤية جميع المشاريع</a>
        </div>
    </section>

    <section id="reviews" class="max-w-7xl mx-auto px-6 py-20 relative z-10">
        <h2 id="reviews-head" class="text-4xl font-black mb-16 text-center reveal fade-up">آراء العملاء</h2>
        <div id="reviews-container" class="grid md:grid-cols-2 gap-10"></div>
        <div class="mt-16 text-center flex justify-center gap-4 flex-wrap reveal fade-up delay-200">
            <a href="../reviews-view-page/reviews-view.html" id="btn-all-reviews" class="inline-block px-10 py-4 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black rounded-2xl shadow-xl hover:-translate-y-1 hover:shadow-blue-500/20 transition-all border border-transparent dark:hover:bg-slate-100">رؤية جميع التقييمات</a>
            <a href="../reviews-page/reviews.html" id="btn-add-review" class="inline-block px-10 py-4 border-2 border-blue-600 text-blue-600 dark:text-blue-400 font-black rounded-2xl shadow-xl hover:-translate-y-1 hover:bg-blue-600 hover:text-white transition-all">أضف تقييمك</a>
        </div>
    </section>

    <section id="contact" class="max-w-4xl mx-auto px-6 py-20 relative z-10">
        <div class="glass-card p-12 relative overflow-hidden reveal fade-up">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl"></div>
            <h2 id="contact-head" class="text-3xl font-black mb-10 text-center">ارسل لي رسالة</h2>
            <form id="contact-form" class="space-y-6 relative z-10">
                <div class="grid md:grid-cols-2 gap-6">
                    <input type="text" id="name" placeholder="الاسم" required class="glass-input">
                    <input type="email" id="email" placeholder="البريد الإلكتروني" required class="glass-input">
                </div>
                <textarea id="message" rows="4" placeholder="رسالتك..." required class="glass-input"></textarea>
                <button type="submit" id="btn-send-message" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl shadow-xl shadow-blue-500/30 transition-all hover:-translate-y-1 active:scale-95 text-lg">إرسال الرسالة</button>
            </form>
        </div>
    </section>

    <div id="success-popup" class="fixed inset-0 z-[100] flex items-center justify-center px-6 hidden opacity-0 transition-all duration-500">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md"></div>
        <div class="relative bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl border border-blue-500/30 max-w-sm w-full text-center scale-90 transition-transform duration-500" id="popup-content">
            <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-10 h-10 text-blue-500"></i>
            </div>
            <h3 class="text-2xl font-black mb-2 dark:text-white" id="popup-head">تم الإرسال!</h3>
            <p class="text-slate-500 dark:text-slate-400 mb-8" id="popup-msg">تم إرسال رسالتك بنجاح.</p>
            <button onclick="closePopup()" id="popup-btn" class="w-full py-3 bg-slate-100 dark:bg-slate-800 font-bold rounded-xl hover:bg-blue-500 hover:text-white transition-all">إغلاق</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
